name: auto-purge

on:
  schedule:
    - cron: "17 * * * *"      # 每小时第 17 分钟运行
  workflow_dispatch: {}        # 支持手动触发

permissions:
  contents: write

concurrency:
  group: auto-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 完整历史，才能查到文件真实的最后提交时间

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Purge images older than 3 hours
        run: python purge.py
